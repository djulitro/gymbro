version: '3.8'

services:
  ### BASE DE DATOS - MYSQL ###
  mysql:
    image: mysql:8.0
    container_name: gymbro_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gymbro
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  ### BACKEND - LARAVEL ###
  backend:
    build:
      context: ./gymbro-backend
      dockerfile: Dockerfile
    container_name: gymbro_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./gymbro-backend:/var/www
      - /var/www/vendor/
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=gymbro
      - DB_USERNAME=root
      - DB_PASSWORD=root
    entrypoint: ["/bin/sh", "-c", "chmod +x /var/www/start.sh && /var/www/start.sh"]

