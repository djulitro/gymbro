version: '3.8'

services:
  ### BASE DE DATOS - MYSQL ###
  mysql:
    image: mysql:8.0
    container_name: gymbro_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gymbro
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./systems/mysql/scripts:/docker-entrypoint-initdb.d/
      - ./systems/mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  ### BACKEND - LARAVEL ###
  backend:
    build:
      context: ./systems/gymbro-backend
      dockerfile: Dockerfile
    container_name: gymbro_backend
    working_dir: /app
    volumes:
      - ./systems/gymbro-backend:/app
    ports:
      - "8010:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      bash -c "composer install && php artisan migrate && php artisan serve --host=0.0.0.0"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=gymbro
      - DB_USERNAME=root
      - DB_PASSWORD=root

